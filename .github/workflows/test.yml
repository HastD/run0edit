name: Python tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unittest:
    name: Run Python unit tests and linters
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install coverage meson pytest ruff ty uv
          sudo apt install just pandoc

      - name: Run tests
        run: |
          just test

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install meson uv
          sudo apt install pandoc

      - name: Set up passwordless authentication
        run: |
          cat <<EOF | sudo tee /etc/polkit-1/rules.d/10-systemd-nopasswd.rules >/dev/null
          polkit.addRule(function(action, subject) {
              if (subject.user === "${USER}") {
                  return polkit.Result.YES;
              }
          });
          EOF

      - name: Run integration tests
        run: |
          mkdir -p build
          meson setup build -Dprefix=/usr -Dunit-tests=disabled -Dintegration-tests=enabled
          meson compile -C build
          meson test -C build --verbose integration-test

      - name: Show full test logs
        if: always()
        run: |
          cat ./build/meson-logs/testlog.txt
