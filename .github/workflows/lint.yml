name: Linters

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE spec compliance
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check REUSE compliance
        shell: bash
        run: |
          pipx run reuse lint

  rpmlint:
    name: Lint RPM spec
    runs-on: ubuntu-26.04
    container: fedora:45 # zizmor: ignore[unpinned-images]
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo dnf install -y rpmlint

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run rpmlint
        shell: bash
        run: |
          rpmlint rpm/run0edit.spec
